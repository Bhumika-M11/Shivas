<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form | Shivas Travel Guru</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .hero-form {
            width: 420px;
            max-width: 92%;
            margin: 40px auto;
            padding: 25px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .hero-form h3 {
            text-align: center;
            margin: 0 0 10px;
            color: #11173b;
        }

        .hero-form > p {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .hero-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        .hero-form label span {
            color: red;
        }

        .hero-form input,
        .hero-form select,
        .hero-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }

        .hero-form input:focus,
        .hero-form select:focus,
        .hero-form textarea:focus {
            outline: none;
            border-color: #11173b;
        }

        .form-btn {
            width: 100%;
            padding: 13px;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .form-btn:hover {
            background: #1ebe5d;
        }

        .home-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: rgba(17, 23, 59, .96);
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .home-btn:hover {
            background: #0b5ed7;
        }

        #result {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .hero-form {
                margin: 20px auto;
                padding: 20px;
            }

            .home-btn {
                margin: 15px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="home-btn">← Back to Home</a>

    <div class="hero-form">

        <h3>Get an Instant Quote</h3>

        <p>
            Fill in your travel details and we'll contact you within minutes.
        </p>

        <form id="heroForm">

            <label for="name">
                Full Name <span>*</span>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>


            <label for="phone">
                Mobile Number <span>*</span>
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your mobile number"
                required>


            <label for="pickup">
                Pickup Location <span>*</span>
            </label>

            <input
                type="text"
                id="pickup"
                name="pickup"
                placeholder="Enter pickup location"
                required>


            <label for="drop">
                Drop Location
            </label>

            <input
                type="text"
                id="drop"
                name="drop"
                placeholder="Enter drop location">


            <label for="date">
                Travel Date
            </label>

            <input
                type="date"
                id="date"
                name="date">


            <label for="time">
                Pickup Time <span>*</span>
            </label>

            <input
                type="time"
                id="time"
                name="time"
                required>


            <label for="vehicle">
                Select Vehicle <span>*</span>
            </label>

            <select id="vehicle" name="vehicle" required>

                <option value="">Choose Vehicle</option>

                <option value="Sedan">Sedan</option>

                <option value="SUV">SUV</option>

                <option value="Ertiga">Ertiga</option>

                <option value="Innova Crysta">Innova Crysta</option>

                <option value="Tempo Traveller">Tempo Traveller</option>

                <option value="Force Urbania">Force Urbania</option>

                <option value="Luxury Vehicle">Luxury Vehicle</option>

            </select>


            <label for="triptype">
                Trip Type
            </label>

            <select id="triptype" name="triptype">

                <option value="">Choose Trip Type</option>

                <option value="Airport Transfer">
                    Airport Transfer
                </option>

                <option value="Local">
                    Local
                </option>

                <option value="Outstation">
                    Outstation
                </option>

                <option value="One Way">
                    One Way
                </option>

                <option value="Round Trip">
                    Round Trip
                </option>

            </select>


            <label for="message">
                Travel Requirements
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Tell us about your travel requirements..."></textarea>


            <button
                type="submit"
                class="form-btn">

                💬 Get Free Quote on WhatsApp

            </button>

            <p id="result"></p>

        </form>

    </div>


    <script>

        const form = document.getElementById("heroForm");
        const status = document.getElementById("result");

        // Shivas Travel Guru WhatsApp number
        const whatsappNumber = "919019993283";


        form.addEventListener("submit", function (e) {

            e.preventDefault();

            // Get form values
            const name =
                document.getElementById("name").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const pickup =
                document.getElementById("pickup").value.trim();

            const drop =
                document.getElementById("drop").value.trim();

            const date =
                document.getElementById("date").value;

            const time =
                document.getElementById("time").value;

            const vehicle =
                document.getElementById("vehicle").value;

            const triptype =
                document.getElementById("triptype").value;

            const message =
                document.getElementById("message").value.trim();


            // Create WhatsApp message
            const whatsappMessage =

`NEW TRAVEL ENQUIRY
━━━━━━━━━━━━━━━━━━━━

CUSTOMER DETAILS

Name: ${name}
Mobile: ${phone}

TRIP DETAILS

Pickup: ${pickup}
Drop: ${drop || "Not specified"}

Travel Date: ${date || "Not specified"}
Pickup Time: ${time}

Vehicle: ${vehicle}
Trip Type: ${triptype || "Not specified"}

TRAVEL REQUIREMENTS

${message || "No additional requirements"}

━━━━━━━━━━━━━━━━━━━━

Enquiry from Shivas Travel Guru Website`;


            // Create WhatsApp URL
            const whatsappURL =
                "https://wa.me/" +
                whatsappNumber +
                "?text=" +
                encodeURIComponent(whatsappMessage);


            // Show status
            status.innerHTML =
                "✅ Opening WhatsApp...";

            status.style.color = "#168c45";


            // Open WhatsApp
            window.open(
                whatsappURL,
                "_blank"
            );


            // Reset form
            form.reset();

        });

    </script>

</body>
</html>
