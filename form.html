<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>
        .hero-form{
            width:420px;
            margin:40px auto;
            padding:25px;
            background:#fff;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        .hero-form h3{
            text-align:center;
            margin-bottom:10px;
        }

        .hero-form p{
            text-align:center;
            color:#666;
            margin-bottom:20px;
        }

        .hero-form input,
        .hero-form select,
        .hero-form textarea{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
            font-size:16px;
        }

        .form-btn{
            width:100%;
            padding:12px;
            background:rgba(17,23,59,.96);
            color:#fff;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        .form-btn:hover{
            background:rgba(17,23,59,.96);
        }
        .home-btn{
            display:inline-block;
            margin:20px;
            padding:10px 20px;
            background:rgba(17,23,59,.96);
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .home-btn:hover{
            background:#0b5ed7;
        }
    </style>
    <a href="index.html" class="home-btn">← Back to Home</a>
</head>
<body>

<div class="hero-form">
    <h3>Get an Instant Quote</h3>
    <p>Fill in your travel details and we'll contact you within minutes.</p>

    <form id="heroForm">

        <label for="name">Full Name <span>*</span></label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="phone">Mobile Number <span>*</span></label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your mobile number" required>

    <label for="pickup">Pickup Location <span>*</span></label>
    <input type="text" id="pickup" name="pickup" placeholder="Enter pickup location" required>

    <label for="drop">Drop Location</label>
    <input type="text" id="drop" name="drop" placeholder="Enter drop location">

    <label for="date">Travel Date</label>
    <input type="date" id="date" name="date">

    <label for="time">Pickup Time</label>
    <input type="time" id="time" name="time" required>

    <label for="vehicle">Select Vehicle</label>
    <select id="vehicle" name="vehicle" required>
        <option value="">Choose Vehicle</option>
        <option>Sedan</option>
        <option>SUV</option>
        <option>Ertiga</option>
        <option>Innova Crysta</option>
        <option>Tempo Traveller</option>
        <option>Force Urbania</option>
        <option>Luxury Vehicle</option>
    </select>

    <label for="triptype">Trip Type</label>
    <select id="triptype" name="triptype">
        <option value="">Choose Trip Type</option>
        <option>Airport Transfer</option>
        <option>Local</option>
        <option>Outstation</option>
        <option>One Way</option>
        <option>Round Trip</option>
    </select>

    <label for="message">Travel Requirements</label>
    <textarea id="message" name="message" rows="6"
        placeholder="Tell us about your travel requirements..."></textarea>

        <button type="submit" class="btn form-btn">
            Get Free Quote
        </button>

            <p id="result"></p>

    </form>
</div>

<p id="result"></p>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbwPUOKRHEEibFGUDzMpO86cnJtaevdNpQvM-r6zjyBgAEjIhMYrlEAD_XFD-kQMo1Xw/exec";

const form = document.getElementById("heroForm");
const status = document.getElementById("result");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    status.innerHTML = "Submitting...";

    fetch(scriptURL, {
        method: "POST",
        body: new FormData(form),
        mode: "no-cors"
    })
    .then(() => {
        status.innerHTML = "✅ Enquiry Submitted Successfully";
        form.reset();
    })
    .catch(error => {
        console.error(error);
        status.innerHTML = "❌ " + error.message;
    });
});

</script>
</body>
</html>
